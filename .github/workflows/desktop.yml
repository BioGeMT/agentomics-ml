name: Desktop app

# Builds the desktop app's installers on each OS (the bundled agentomics-run can only be built on the OS
# it is for). Started by hand; the installers are attached to the run as artifacts.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Desktop app (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
          - name: Linux x64
            os: ubuntu-latest
          - name: Windows x64
            os: windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install the UI's npm packages
        run: |
          npm --prefix ui/renderer ci
          npm --prefix ui/desktop ci

      - name: Typecheck
        run: |
          npm --prefix ui/renderer run typecheck
          npm --prefix ui/desktop run typecheck

      - name: Build installers
        working-directory: ui/desktop
        env:
          # Only the certificate given here is used; none is looked for on the runner.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # macOS: with these repository secrets the app is signed with a Developer ID certificate and
          # notarized (docs/developer/desktop-app.md, "Signing"). A missing secret is empty, which
          # electron-builder treats as not given, so the build stays unsigned. Linux and Windows are unsigned.
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CERTIFICATE_P12_BASE64 || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
        run: npm run dist

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: agentomics-desktop-${{ runner.os }}
          path: |
            ui/desktop/release/*.dmg
            ui/desktop/release/*.AppImage
            ui/desktop/release/*.deb
            ui/desktop/release/*.exe
          if-no-files-found: error
