name: Publish Agentomics Release

on:
  release:
    types:
      - published

permissions: {}

jobs:
  docker:
    name: Build and publish Docker image to Docker Hub
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      RELEASE_TAG: "${{ github.event.release.tag_name }}"

    steps:
      - name: Check out the published Release tag
        uses: actions/checkout@v4.2.2
        with:
          ref: "refs/tags/${{ github.event.release.tag_name }}"

      - name: Validate Release identity
        id: release
        run: |
          project_version="$(
            python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])'
          )"
          if [[ ! "$project_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] ||
             [[ "$RELEASE_TAG" != "v$project_version" ]]; then
            echo "Release tag $RELEASE_TAG does not match stable project.version $project_version" >&2
            exit 1
          fi
          echo "version=$project_version" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3.4.0
        with:
          username: "${{ secrets.DOCKERHUB_USERNAME }}"
          password: "${{ secrets.DOCKERHUB_TOKEN }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.11.1

      - name: Build and push the Docker Release artifact
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          build-args: REPOSITORY_SOURCE=.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: biogemt/agentomics:${{ steps.release.outputs.version }}
          cache-from: type=gha,scope=release-${{ github.event.release.tag_name }}
          cache-to: type=gha,mode=max,scope=release-${{ github.event.release.tag_name }}

  pypi:
    name: Create PyPI Release artifact
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: "https://pypi.org/project/agentomics/"
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out the published Release tag
        uses: actions/checkout@v4.2.2
        with:
          ref: "refs/tags/${{ github.event.release.tag_name }}"

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Build one wheel and one source distribution
        run: |
          python -m pip install --disable-pip-version-check build
          rm -rf build dist
          python -m build --wheel --sdist --outdir dist

      - name: Upload through PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: dist/
          attestations: true
