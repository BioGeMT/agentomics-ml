name: Pull Request Title

on:
  pull_request_target:
    branches:
      - main
    # Keep the default lifecycle events and add edited so title changes rerun validation.
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number }}"
  cancel-in-progress: true

jobs:
  validate:
    name: Validate PR title (Release Impact)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout title policy
        uses: actions/checkout@v4.2.2
        with:
          ref: "${{ github.event.pull_request.base.sha }}"

      - name: Validate Release Impact declaration
        env:
          PR_TITLE: "${{ github.event.pull_request.title }}"
        run: python3 scripts/validate_pr_title.py "$PR_TITLE"
