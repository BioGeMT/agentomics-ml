name: Automated Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  # Enables manual runs; no inputs are required.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Group runs by workflow and PR number, falling back to the branch or tag ref.
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  # Cancel an obsolete run when a newer commit starts one in the same group.
  cancel-in-progress: true

jobs:
  test:
    name: Automated tests (CPU-only)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install host CLI and test dependencies
        run: pip install -e .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime image from checkout
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: REPOSITORY_SOURCE=.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true
          push: false
          tags: agentomics:ci

      # Free GitHub-hosted runners have no GPU.
      - name: Run CPU-compatible test suite
        run: python scripts/run_tests.py --image agentomics:ci --cpu-only
