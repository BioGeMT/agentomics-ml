<!-- A layer for an Icon Composer .icon (app-icons.md: square and unmasked; the system applies the corners, highlights and Liquid Glass). The same design on the legacy macOS grid, for today's .icns, is ../icon.svg. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a86f5"/>
      <stop offset="1" stop-color="#2442b0"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
</svg>
