[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentomics"
version = "1.2.0"
description = "Package for running Agentomics - an autonomous agentic system for ML model development"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "genomic-benchmarks==1.0.0",
    "hrid>=0.3.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "Pillow==12.0.0",
    "scikit-learn>=1.5",
    "scipy>=1.11",
    "rich>=14.0",
    "pytest==9.1.1",
    "pypdf>=6.0",
]
license = { file = "LICENSE" }
authors = [
    { name = "Vlastimil Martinek" },
]
maintainers = [
    { name = "Vlastimil Martinek", email = "martinekvlastimil95@gmail.com" },
]

[project.urls]
Documentation = "https://biogemt.github.io/agentomics-ml/"
Repository = "https://github.com/BioGeMT/Agentomics-ML"

[project.scripts]
agentomics-download-dataset = "agentomics.cli.download_dataset:main"
agentomics-run = "agentomics.cli.run:main"
agentomics-inference = "agentomics.cli.inference:main"
agentomics-retrain = "agentomics.cli.retrain:main"
agentomics-check-dataset = "agentomics.cli.check_dataset:main"
agentomics-add-supplementary = "agentomics.cli.add_supplementary:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}
packages = [
    "agentomics",
    "agentomics.cli",
    "agentomics.datasets",
    "agentomics.runtime",
    "agentomics.utils",
]

[tool.setuptools.package-data]
agentomics = [
    "supplementary_catalog/README.md",
    "supplementary_catalog/foundation_models/*.md",
]

[tool.ruff]
required-version = "==0.17.5"
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I"]
ignore = [
    "BLE001",
    "E722",
    "EXE001",
    "F401",
    "F541",
    "F811",
    "F821",
    "F841",
    "I001",
    "ISC004",
    "PLW1510",
    "RUF010",
    "RUF012",
    "RUF013",
    "RUF015",
    "S110",
    "SIM103",
    "SIM114",
    "SIM117",
    "SIM118",
    "TRY004",
    "UP006",
    "UP017",
    "UP035",
    "UP037",
    "UP039",
    "UP045",
]
