[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentomics-ml"
version = "0.1.0"
description = "Agentomics: autonomous ML agent for biological machine learning tasks"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
  "rich>=14,<15",
  "python-dotenv>=1.1,<2",
  "wandb>=0.21,<0.22",
  "weave>=0.52,<0.53",
  "timeout-function-decorator>=2.0,<3",
  "pydantic>=2,<3",
  "pydantic-ai>=1.53,<2",
  "openai>=2.16,<3",
  "anthropic>=0.79,<0.80",
  "httpx>=0.28,<1",
  "requests>=2.32,<3",
  "PyYAML>=6,<7",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
  "hrid>=0.3,<1",
]

[project.optional-dependencies]
foundation-models = [
  "torch>=2.9,<3",
  "transformers>=4.47,<5",
  "einops>=0.8,<1",
  "multimolecule>=0.0.8,<1",
]
reports = [
  "matplotlib>=3.8,<4",
  "reportlab>=4.2,<5",
  "seaborn>=0.13,<1",
]
datasets = [
  "genomic-benchmarks",
  "miRBench",
]
all = [
  "agentomics-ml[foundation-models,reports,datasets]",
]

[project.scripts]
agentomics = "agentomics.run_agent_interactive:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agentomics.utils.providers" = ["configured_providers.yaml"]
"agentomics.resources.foundation_models" = ["*.yaml", "*.md"]
